site_name: Hacking Mabu 2
site_url: https://electronick-co.github.io/hacking_mabu2/
theme:
  name: material

  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow    
  
  plugins:
  - search
  - blog

markdown_extensions:
  - tables
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Page tree
nav:
  - Home: 
    - index.md
    - about.md
  - Quick start guide: 
    - quickstart_guide.md
  - Documentation:
    - Animatronics Board:
      - subsystems/animatronics.md
      - subsystems/protocol_intro.md
      - subsystems/protocol_complete.md
    - subsystems/tablet.md
  - Blog: 
    - blog/index.md